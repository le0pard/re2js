# No dependency is fetched from git; an empty list blocks git dependencies entirely.
approvedGitRepositories: []

compressionLevel: mixed

enableGlobalCache: false

# Third-party install scripts are a common supply-chain attack vector, and no dependency needs
# one (Playwright browsers are installed by an explicit command).
enableScripts: false

nodeLinker: node-modules

# Only install versions published at least three days ago, so a compromised release is
# usually caught and unpublished before it can reach this project.
npmMinimalAgeGate: 3d

yarnPath: .yarn/releases/yarn-4.18.1.cjs
