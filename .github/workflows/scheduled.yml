name: Scheduled
on:
  schedule:
    # Mondays at 04:17 UTC
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  exhaustive:
    name: 'Exhaustive RE2 conformance'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.JS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: 'yarn'
          node-version-file: '.tool-versions'

      - name: Install Javascript dependencies
        run: yarn install --immutable

      # All 5.8 million lines of the RE2 exhaustive data, through every engine
      - name: Run the exhaustive conformance tests
        env:
          RE2JS_EXHAUSTIVE: '1'
        run: yarn vitest run --project=node src/__tests__/Exec.test.js

  bench:
    name: 'Benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.JS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: 'yarn'
          node-version-file: '.tool-versions'

      - name: Install Javascript dependencies
        run: yarn install --immutable

      # Kept as an artifact to compare runs over time; shared runners are too noisy to gate on
      - name: Run benchmarks
        run: yarn vitest bench --run --project=node --outputJson bench.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.run_number }}
          path: bench.json
          retention-days: 90
